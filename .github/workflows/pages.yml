name: Publish Idea Lab dashboard · GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-gobierno-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public-only repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test syntax and CSV integrity
        shell: bash
        run: |
          node --check site/assets/app.js
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path("site")
          required=["index.html","finanzas-publicas.html","metodologia.html","assets/app.js","assets/style.css","data/observations.csv","data/public-finance.csv","data/finance-sources.csv"]
          assert all((p/x).is_file() for x in required), "Static asset missing"
          with (p/"data/observations.csv").open(encoding="utf-8",newline="") as f:
              obs=list(csv.DictReader(f))
          assert len(obs)>=300, "Observations dataset unexpectedly small"
          assert not any(x["indicator_id"] in ("indice_precio_alquiler","variacion_precio_alquiler") for x in obs), "Ambiguous rental indicators leaked"
          with (p/"data/public-finance.csv").open(encoding="utf-8",newline="") as f:
              fiscal=list(csv.DictReader(f,delimiter=";"))
          assert len(fiscal)>=90, "Public finance dataset unexpectedly small"
          for x in ["S13.GASTO","S13.RECURSOS","S13.DEFICIT"]:
              assert any(r["codigo"]==x for r in fiscal), "Missing fiscal control total: "+x
          for f in p.rglob("*"):
              if f.is_file() and f.suffix.lower() in {".html",".js",".css",".csv"}:
                  data=f.read_text(encoding="utf-8").lower()
                  for forbidden in ["@gmail.com","-----begin private key-----","github_pat_","docs.google.com/spreadsheets/","drive.google.com/drive/folders/"]:
                      assert forbidden not in data,(str(f),forbidden)
          print("OK:",len(obs),"observations,",len(fiscal),"fiscal lines; public privacy and quality checks passed")
          PY
      - name: Configure free GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
