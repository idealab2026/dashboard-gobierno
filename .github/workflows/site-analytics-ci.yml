name: IDEA LAB · Cloudflare Web Analytics · integración pública

on:
  pull_request:
    paths:
      - 'observablehq.config.js'
      - 'app/components/public-finance-sankey.js'
      - 'app/*.md'
      - 'scripts/tests/test_cloudflare_analytics.py'
      - '.github/workflows/site-analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrato Cloudflare · token público, un beacon y sin GoatCounter
        run: python3 -m unittest discover -s scripts/tests -p 'test_cloudflare_analytics.py' -v
      - name: Preparar Python como el despliegue oficial
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de compilación
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          npm ci
      - name: Generar la información oficial disponible (igual que el despliegue)
        run: |
          python scripts/refresh_official.py
          python scripts/fetch_ine_latest.py
          python scripts/update_ine_ecp320.py
          python scripts/inspect_igae_annual.py
          python scripts/validate_public.py
      - name: Verificar que todas las páginas compilan
        run: npm run build
