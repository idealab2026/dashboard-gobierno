name: IDEA LAB · Validación PR de explorador presupuestario
on:
  pull_request:
    paths:
      - 'app/components/partidas-search.js'
      - 'app/components/public-finance-sankey.js'
      - 'app/buscador-partidas.md'
      - 'scripts/tests/test_named_spending.py'
      - '.github/workflows/public-finance-pr.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source syntax and official provenance
        run: |
          node --check app/components/partidas-search.js
          node --check app/components/public-finance-sankey.js
          python -m unittest discover -s scripts/tests -p "test_*.py" -v
          python scripts/validate_public.py
      - name: Build and audit public artifacts
        run: |
          npm ci
          npm run build
          cp app/logo-idea-lab.svg dist/logo-idea-lab.svg
          cp app/favicon.svg dist/favicon.svg
          python scripts/audit_build.py
