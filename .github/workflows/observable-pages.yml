name: Idea Lab V2 · build, official checks and Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'observablehq.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/observable-pages.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: idea-lab-public-v2
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: public-observatory
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI: 'true'
    steps:
      - name: Read isolated public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local build dependencies
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          npm ci
      - name: Build 22 official ministry and 17 CCAA spending datasets
        run: python scripts/build_administration_sankeys.py
      - name: Inspect COFOG historical xlsx for verified year extraction
        run: python scripts/inspect_cofog_history.py
      - name: Weekly check against official INE and IGAE sources
        run: python scripts/refresh_official.py
      - name: Read latest literal INE observations
        run: python scripts/fetch_ine_latest.py
      - name: Unit tests · pinned INE series and fail-closed updates
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Search semantics · COFOG health and project anti-false-positives
        run: node --test scripts/tests/test_spending_query.mjs
      - name: Update only validated annual population figures (official INE ECP320)
        run: python scripts/update_ine_ecp320.py
      - name: Inspect official IGAE annual S13 workbook (no numerical overwrite)
        run: python scripts/inspect_igae_annual.py
      - name: Validate statistical and public-only data
        run: python scripts/validate_public.py
      - name: Compile original V2 dashboard and Sankey
        run: npm run build
      - name: Include IDEA LAB logo and favicon in published files
        run: |
          cp app/logo-idea-lab.svg dist/logo-idea-lab.svg
          cp app/favicon.svg dist/favicon.svg
      - name: Audit public bundle and Sankey integrity
        run: python scripts/audit_build.py
      - name: Browser smoke test · no Observable RuntimeError and visible Sankey/KPIs
        run: python scripts/smoke_runtime.py
      - name: Configure Pages without paid hosting
        uses: actions/configure-pages@v5
      - name: Upload static build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish full V2
        uses: actions/deploy-pages@v4
        id: deployment
