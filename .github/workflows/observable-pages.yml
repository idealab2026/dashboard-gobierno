name: Idea Lab V2 · build, official checks and Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'observablehq.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/observable-pages.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: idea-lab-public-v2
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI: 'true'
    steps:
      - name: Read isolated public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local build dependencies
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'
          npm ci
      - name: Weekly check against official INE and IGAE sources
        run: python scripts/refresh_official.py
      - name: Validate statistical and public-only data
        run: python scripts/validate_public.py
      - name: Compile original V2 dashboard and Sankey
        run: npm run build
      - name: Audit public bundle and Sankey integrity
        run: python scripts/audit_build.py
      - name: Configure Pages without paid hosting
        uses: actions/configure-pages@v5
      - name: Upload static build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish full V2
        uses: actions/deploy-pages@v4
        id: deployment
