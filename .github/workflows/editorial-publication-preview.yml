name: Prueba de publicación @LARREALIDAD (sin envío a X)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'editorial/drafts/**'
      - 'editorial/prepare_publication.py'
      - 'editorial/tests/test_publication_preview.py'
      - '.github/workflows/editorial-publication-preview.yml'
  push:
    branches: [main]
    paths:
      - 'editorial/drafts/**'
      - 'editorial/prepare_publication.py'
      - 'editorial/tests/test_publication_preview.py'
      - '.github/workflows/editorial-publication-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validar ocho publicaciones, fuentes, fechas y límites de X
        run: python3 -m unittest discover -s editorial/tests -p 'test_*.py' -v
      - name: Preparar campaña editorial con enlaces a X (sin publicación)
        run: python3 editorial/campaign.py --days 14
      - name: Mantener vista previa legacy del post del Sankey
        run: python3 editorial/prepare_publication.py
